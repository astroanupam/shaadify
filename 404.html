<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shaadify</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbf6ea;color:#33201a;font-family:Segoe UI,system-ui,sans-serif;text-align:center}a{color:#9b1d3a}</style></head>
<body><div><h1 style="color:#7a1f2b">Shaadify</h1><p>That page does not exist.</p><p><a id="home" href="./">Open Shaadify</a></p></div>
<script>
  // On GitHub project pages the app lives at /<repository>/, so send people back there.
  var seg = location.pathname.split('/')[1];
  if (location.hostname.slice(-10) === '.github.io' && seg && seg.indexOf('.') < 0) document.getElementById('home').href = '/' + seg + '/';
</script></body></html>
